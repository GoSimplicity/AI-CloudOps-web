name: Verify web
on:
  push:
  pull_request:
# 与 gitleaks.yml 相同：PR 的新推送可以取消旧的校验；push 不取消，且 group 带 run_id 使每次 push 运行独立
# （GitHub 会取消同组中“排队中”的旧运行，与 cancel-in-progress 无关）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:layout
      - run: pnpm -F @vben/web-antd typecheck
      - run: pnpm test:unit --run
      - run: pnpm build:antd
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify production login bootstrap
        run: pnpm test:e2e --grep "login is usable"
        env:
          CLOUDOPS_PREVIEW: "true"
          CLOUDOPS_ROUTER_HISTORY: hash
          PLAYWRIGHT_CHANNEL: chromium
