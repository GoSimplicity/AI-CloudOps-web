name: Verify web
on:
  push:
  pull_request:
# 与 gitleaks.yml 相同：PR 的新推送可以取消旧的校验；push 不取消，且 group 带 run_id 使每次 push 运行独立
# （GitHub 会取消同组中“排队中”的旧运行，与 cancel-in-progress 无关）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      # 全部依赖（含 devDependencies，Vite 在其中）的 critical 只报警。
      # 生产 high 门禁暂时放不过时的豁免写法见 SECURITY.md。
      - name: Audit all dependencies for critical issues
        continue-on-error: true
        run: pnpm audit --audit-level=critical
      - run: pnpm check:layout
      - run: pnpm exec stylelint "**/*.{vue,css,less,scss}" --cache
      - run: pnpm check:eslint-boundaries
      - run: pnpm -F @vben/eslint-config typecheck
      - name: Typecheck web-antd
        run: pnpm -F @vben/web-antd typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm exec tsc --noEmit -p apps/web-antd/tsconfig.node.json
      - run: pnpm test:unit --run
      - run: pnpm test:demo
      - run: pnpm build:antd
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify production login bootstrap
        run: pnpm test:e2e --grep "login is usable"
        env:
          CLOUDOPS_PREVIEW: "true"
          CLOUDOPS_ROUTER_HISTORY: hash
          PLAYWRIGHT_CHANNEL: chromium
